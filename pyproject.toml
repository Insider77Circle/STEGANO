[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stegano"
version = "0.2.0"
description = "Invisible-Unicode steganography toolkit for LLM red-team research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Insider77Circle" }]

[project.scripts]
stegano = "stegano.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stegano*"]
